services:
  - type: web
    name: b3lab
    runtime: docker
    plan: free
    branch: main
    # Deep readiness through Next.js. Only a fully serving app returns 200. During the API's
    # boot the route returns 503 with a "starting" body, so Render never routes traffic to a
    # half-ready instance and never mistakes a slow boot for a healthy one.
    healthCheckPath: /health
    autoDeploy: true
