name: Refresh heatmap
on:
  schedule:
    # Pregão B3 das 10:00 às 17:00 BRT (UTC−3, sem horário de verão) = 13:00 às 20:00 UTC, dias úteis.
    - cron: "*/10 13-19 * * 1-5"
    # Depois do fechamento: o Yahoo publica com ~15 min de atraso, 20:20 UTC pega o fechamento.
    - cron: "5,20 20 * * 1-5"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Refresh heatmap snapshot
        env:
          B3LAB_URL: ${{ vars.B3LAB_URL }}
          B3LAB_REFRESH_TOKEN: ${{ secrets.B3LAB_REFRESH_TOKEN }}
        run: |
          if [ -z "$B3LAB_URL" ] || [ -z "$B3LAB_REFRESH_TOKEN" ]; then
            echo "::warning::Defina a variável B3LAB_URL e o segredo B3LAB_REFRESH_TOKEN no repositório."
            exit 0
          fi
          origin="${B3LAB_URL%/}"
          # A primeira requisição acorda o serviço; o Render leva até ~1 min.
          curl --fail --silent --show-error --location --retry 3 --retry-delay 20 \
            --max-time 120 --output /dev/null --write-out "Wake HTTP %{http_code} em %{time_total}s\n" "$origin/"
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 30 --max-time 150 \
            -X POST -H "Authorization: Bearer $B3LAB_REFRESH_TOKEN" -H "Origin: $origin" -H "x-b3lab-request: 1" \
            --write-out "\nRefresh HTTP %{http_code} em %{time_total}s\n" "$origin/api/universe/changes/refresh"
