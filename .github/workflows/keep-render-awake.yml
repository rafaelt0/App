name: Keep Render Awake
on:
  schedule:
    - cron: "*/10 * * * *"  # Render free tier dorme após 15 min sem tráfego
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping app
        env:
          B3LAB_URL: ${{ vars.B3LAB_URL }}
        run: |
          if [ -z "$B3LAB_URL" ]; then
            echo "Defina a variável de repositório B3LAB_URL com a URL pública do Render."
            exit 1
          fi
          # A primeira requisição pode acordar o serviço; o Render leva até ~1 min.
          curl --fail --silent --show-error --location --retry 3 --retry-delay 20 \
            --max-time 120 --output /dev/null --write-out "HTTP %{http_code} em %{time_total}s\n" \
            "$B3LAB_URL"
